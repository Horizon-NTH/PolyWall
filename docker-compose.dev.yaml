services:
  app:
    container_name: polywall-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file: .env
    command: sh -c "CI=true pnpm install --frozen-lockfile && pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - polywall-node-modules-dev:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-3
      S3_BUCKET: ${S3_BUCKET:-polywall-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-polywall}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-polywallsecret}
      S3_FORCE_PATH_STYLE: true
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init

  postgres:
    container_name: polywall-postgres-dev
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - polywall-postgres-data-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: polywall-redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: polywall-minio-dev
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-polywall}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-polywallsecret}
    volumes:
      - polywall-minio-data-dev:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    container_name: polywall-minio-init-dev
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-polywall} ${S3_SECRET_ACCESS_KEY:-polywallsecret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-polywall-dev} &&
      mc anonymous set none local/${S3_BUCKET:-polywall-dev}
      "

volumes:
  polywall-postgres-data-dev:
    driver: local
  polywall-node-modules-dev:
    driver: local
  polywall-minio-data-dev:
    driver: local
